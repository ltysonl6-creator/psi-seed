[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-seed"
version = "1.0.0"
description = "Ψ-SEED constitutional and persistence reference implementation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["psi_seed*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
